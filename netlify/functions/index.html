
<!DOCTYPE html>

<style>

body{margin:0;min-height:100vh;background:#050914;color:#eafaff;font-family:Arial;display:flex;align-items:center;justify-content:center;padding:15px}
.app{width:100%;max-width:650px;text-align:center;background:#101b2c;border:1px solid #174c66;border-radius:25px;padding:25px;box-shadow:0 0 35px #00cfff22}
h1{color:#42e8ff;letter-spacing:7px;margin:5px}
.sub{color:#8baaba;font-size:13px}
.face{width:190px;height:145px;border:3px solid #36dcff;border-radius:48%;margin:25px auto;box-shadow:0 0 25px #00d9ff66;display:flex;align-items:center;justify-content:center;gap:35px;position:relative}
.eye{width:24px;height:30px;background:#47edff;border-radius:50%;box-shadow:0 0 15px #00dfff}
.mouth{position:absolute;bottom:30px;width:45px;height:9px;border-bottom:4px solid #47edff;border-radius:50%}
.listening .face{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 45px #00eaff}}
#status{color:#42e8ff;min-height:25px;font-size:14px}
#answer{background:#071321;border-radius:15px;padding:17px;min-height:90px;text-align:left;line-height:1.5;margin:15px 0;white-space:pre-wrap}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #26758b;background:#071321;color:white;font-size:16px;outline:none}
.buttons{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{flex:1;min-width:90px;padding:13px;border:0;border-radius:12px;background:#13b8d7;color:#00131b;font-weight:bold;font-size:14px;cursor:pointer}
button:hover{background:#65eaff}
.mic{background:#b5f4ff}.stop{background:#ff647c}
.small{font-size:12px;color:#829eac;margin-top:18px}
</style>
</head>
<body>
<div class="app" id="app">
<h1>AURA</h1>
<div class="sub">YOUR VOICE CONTROLLED VIRTUAL ASSISTANT</div>
<div class="face"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div id="status">SYSTEM ONLINE • READY</div>
<div id="answer">Hello! I am AURA. Ask me a question or give me a command.</div>
<input id="question" placeholder="Type your question here...">
<div class="buttons">
<button onclick="send()">SEND</button>
<button class="mic" onclick="listen()">🎤 SPEAK</button>
<button class="stop" onclick="stopSpeaking()">STOP</button>
</div>
<div class="small">Try: "Define impulse" • "What is mole concept?" • "What is a function?" • "Calculate 25 times 4"</div>
</div>

<script>
const input=document.getElementById("question");
const answer=document.getElementById("answer");
const statusText=document.getElementById("status");
const app=document.getElementById("app");

function speak(text){
 speechSynthesis.cancel();
 const msg=new SpeechSynthesisUtterance(text);
 msg.lang="en-IN";
 msg.rate=1;
 speechSynthesis.speak(msg);
}
function reply(text){
 answer.textContent=text;
 statusText.textContent="AURA IS RESPONDING";
 speak(text);
}

function calculate(q){
 let s=q.toLowerCase()
 .replace(/what is|calculate|solve|equals|equal to/g,"")
 .replace(/plus/g,"+").replace(/minus/g,"-")
 .replace(/multiplied by|times/g,"*")
 .replace(/divided by/g,"/");
 if(!/^[0-9+\-*/().%\s]+$/.test(s))return null;
 try{
  let tokens=s.match(/\d+(?:\.\d+)?|[()+\-*/%]/g);
  if(!tokens||tokens.join("")!==s.replace(/\s/g,""))return null;
  let i=0;
  function expression(){
   let v=term();
   while(tokens[i]==="+"||tokens[i]==="-"){
    let op=tokens[i++],n=term();
    v=op==="+"?v+n:v-n;
   }
   return v;
  }
  function term(){
   let v=factor();
   while(["*","/","%"].includes(tokens[i])){
    let op=tokens[i++],n=factor();
    if((op==="/"||op==="%")&&n===0)throw Error();
    v=op==="*"?v*n:op==="/"?v/n:v%n;
   }
   return v;
  }
  function factor(){
   if(tokens[i]==="+"){i++;return factor()}
   if(tokens[i]==="-"){i++;return -factor()}
   if(tokens[i]==="("){
    i++;let v=expression();
    if(tokens[i++]!==")")throw Error();
    return v;
   }
   let n=Number(tokens[i++]);
   if(!Number.isFinite(n))throw Error();
   return n;
  }
  let result=expression();
  if(i!==tokens.length||!Number.isFinite(result))return null;
  return "The answer is "+result;
 }catch(e){return null}
}

function processCommand(raw){
 const q=raw.toLowerCase().trim();
 if(!q)return "Please ask me something.";

 if(q.includes("open youtube")){
  window.open("https://www.youtube.com","_blank");
  return "Opening YouTube.";
 }
 if(q.includes("open google")){
  window.open("https://www.google.com","_blank");
  return "Opening Google.";
 }
 if(q.startsWith("search for ")||q.startsWith("search google for ")){
  let term=q.replace("search google for ","").replace("search for ","");
  window.open("https://www.google.com/search?q="+encodeURIComponent(term),"_blank");
  return "Searching Google for "+term;
 }
 if(q.includes("time")||q.includes("clock"))
  return "The current time is "+new Date().toLocaleTimeString("en-IN");
 if(q.includes("date")||q.includes("today"))
  return "Today's date is "+new Date().toLocaleDateString("en-IN",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
 if(q.includes("your name")||q.includes("who are you"))
  return "I am AURA, your virtual assistant.";
 if(q.includes("who created you"))
  return "I was created as a student virtual assistant project.";
 if(q.includes("hello")||q==="hi"||q.includes("hi aura"))
  return "Hello! How can I help you today?";
 if(q.includes("how are you"))
  return "I am functioning perfectly. Thank you for asking!";
 if(q.includes("thank"))
  return "You're welcome! I am ready to help.";
 if(q.includes("bye"))
  return "Goodbye! Have a wonderful day.";

 const math=calculate(q);
 if(math!==null)return math;

 for(const [pattern,response] of knowledge){
  if(pattern.test(q))return response;
 }
 return "I don't have a programmed answer for that question yet. Try another Class 11 Physics, Chemistry, Maths or Computer Science question.";
}

function send(){
 const q=input.value.trim();
 if(!q)return;
 statusText.textContent="PROCESSING...";
 const result=processCommand(q);
 reply(result);
 input.value="";
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){reply("Speech recognition is not supported. Please use Google Chrome.");return;}
 const recognition=new SR();
 recognition.lang="en-IN";
 recognition.interimResults=true;
 recognition.maxAlternatives=1;
 recognition.onstart=()=>{
  app.classList.add("listening");
  statusText.textContent="LISTENING... SPEAK NOW";
 };
 recognition.onresult=e=>{
  let transcript="";
  for(let i=e.resultIndex;i<e.results.length;i++)transcript+=e.results[i][0].transcript;
  input.value=transcript;
  statusText.textContent="I HEARD: "+transcript;
  if(e.results[e.results.length-1].isFinal)setTimeout(send,300);
 };
 recognition.onerror=e=>statusText.textContent="MICROPHONE ERROR: "+e.error;
 recognition.onend=()=>{
  app.classList.remove("listening");
  if(statusText.textContent.startsWith("LISTENING"))statusText.textContent="READY";
 };
 recognition.start();
}
function stopSpeaking(){
 speechSynthesis.cancel();
 statusText.textContent="SPEECH STOPPED";
}
